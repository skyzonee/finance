<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyzone Dashboard Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #080b12; color: #e2e8f0; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="sticky top-0 z-50 glass border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-yellow-400 text-slate-900 p-2.5 rounded-xl shadow-lg shadow-yellow-400/20"><i class="fa-solid fa-gamepad"></i></div>
                <h1 class="text-2xl font-bold tracking-tight text-white">SKYZONE<span class="text-yellow-400"> PRO</span></h1>
            </div>
            <select id="monthSelector" onchange="refreshDashboard()" class="bg-slate-900 border border-white/10 rounded-xl px-4 py-2 text-sm text-slate-300 focus:ring-2 focus:ring-yellow-400 outline-none">
            </select>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
        <!-- Saldo Panel -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-widest mb-2">Saldo Cash</p>
                <input type="text" id="displayCash" onfocus="switchToInput('cash')" class="w-full bg-transparent text-3xl font-bold text-white outline-none cursor-pointer">
                <input type="number" id="inputCash" class="hidden w-full bg-slate-800 text-3xl font-bold text-white outline-none p-2 rounded" onblur="saveAndFormat('cash')">
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-widest mb-2">Saldo QRIS</p>
                <input type="text" id="displayQRIS" onfocus="switchToInput('qris')" class="w-full bg-transparent text-3xl font-bold text-white outline-none cursor-pointer">
                <input type="number" id="inputQRIS" class="hidden w-full bg-slate-800 text-3xl font-bold text-white outline-none p-2 rounded" onblur="saveAndFormat('qris')">
            </div>
        </div>

        <!-- KPI Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass p-5 rounded-2xl"><p class="text-xs text-slate-400 mb-1">Profit</p><h3 class="text-lg font-bold" id="kpi-net-profit">Rp 0</h3></div>
            <div class="glass p-5 rounded-2xl"><p class="text-xs text-slate-400 mb-1">Income</p><h3 class="text-lg font-bold text-emerald-400" id="kpi-total-income">Rp 0</h3></div>
            <div class="glass p-5 rounded-2xl"><p class="text-xs text-slate-400 mb-1">Expense</p><h3 class="text-lg font-bold text-rose-400" id="kpi-total-expense">Rp 0</h3></div>
            <div class="glass p-5 rounded-2xl"><p class="text-xs text-slate-400 mb-1">Trx Count</p><h3 class="text-lg font-bold text-sky-400" id="kpi-total-trx">0</h3></div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl lg:col-span-2 h-80"><canvas id="dailyChart"></canvas></div>
            <div class="glass p-6 rounded-2xl h-80"><canvas id="revenueChart"></canvas></div>
        </div>

        <!-- Form & Table -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl">
                <h2 class="font-bold text-white mb-6">Tambah Transaksi</h2>
                <form id="transactionForm" class="space-y-4">
                    <div class="flex gap-2 p-1 bg-slate-900 rounded-xl border border-white/5">
                        <label class="flex-1 text-center py-2 text-sm font-medium rounded-lg cursor-pointer hover:bg-slate-800 has-[:checked]:bg-yellow-400 has-[:checked]:text-slate-900 transition"><input type="radio" name="type" value="income" checked class="hidden" onchange="updateCategories()"> Income</label>
                        <label class="flex-1 text-center py-2 text-sm font-medium rounded-lg cursor-pointer hover:bg-slate-800 has-[:checked]:bg-rose-500 has-[:checked]:text-white transition"><input type="radio" name="type" value="expense" class="hidden" onchange="updateCategories()"> Expense</label>
                    </div>
                    <select id="category" class="w-full bg-slate-900 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-yellow-400"></select>
                    <input type="number" id="amount" placeholder="Nominal (Rp)" class="w-full bg-slate-900 border border-white/10 p-3 rounded-xl text-white outline-none" required>
                    <input type="date" id="date" class="w-full bg-slate-900 border border-white/10 p-3 rounded-xl text-white outline-none" required>
                    <textarea id="description" placeholder="Catatan..." class="w-full bg-slate-900 border border-white/10 p-3 rounded-xl text-white outline-none"></textarea>
                    <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold py-3 rounded-xl transition">Simpan Transaksi</button>
                </form>
            </div>
            <div class="lg:col-span-2 glass rounded-2xl overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-white/5 border-b border-white/10 text-slate-400"><tr><th class="p-4 text-left">Tanggal</th><th class="p-4 text-left">Deskripsi</th><th class="p-4 text-right">Nominal</th><th class="p-4 text-center">Aksi</th></tr></thead>
                    <tbody id="transactionTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let transactions = JSON.parse(localStorage.getItem('skyzone_transactions')) || [];
        let balances = JSON.parse(localStorage.getItem('skyzone_balances')) || { cash: 0, qris: 0 };
        let dailyChartInstance, revenueChartInstance;

        function formatRupiah(num) {
            return 'Rp ' + Math.floor(num).toLocaleString('id-ID');
        }

        function updateBalanceDisplay() {
            document.getElementById('displayCash').value = formatRupiah(balances.cash);
            document.getElementById('displayQRIS').value = formatRupiah(balances.qris);
            document.getElementById('inputCash').value = balances.cash;
            document.getElementById('inputQRIS').value = balances.qris;
        }

        function switchToInput(type) {
            const displayEl = document.getElementById('display' + type.charAt(0).toUpperCase() + type.slice(1));
            const inputEl = document.getElementById('input' + type.charAt(0).toUpperCase() + type.slice(1));
            
            if (displayEl && inputEl) {
                displayEl.classList.add('hidden');
                inputEl.classList.remove('hidden');
                inputEl.focus();
            }
        }

        function saveAndFormat(type) {
            const inputEl = document.getElementById('input' + type.charAt(0).toUpperCase() + type.slice(1));
            if (inputEl) {
                balances[type] = parseFloat(inputEl.value) || 0;
                localStorage.setItem('skyzone_balances', JSON.stringify(balances));
                updateBalanceDisplay();
            }
            
            document.getElementById('display' + type.charAt(0).toUpperCase() + type.slice(1)).classList.remove('hidden');
            inputEl.classList.add('hidden');
        }

        function saveAndRefresh() {
            localStorage.setItem('skyzone_transactions', JSON.stringify(transactions));
            refreshDashboard();
        }

        function deleteTransaction(id) {
            if (confirm('Hapus transaksi ini?')) {
                transactions = transactions.filter(t => t.id !== id);
                saveAndRefresh();
            }
        }

        function refreshDashboard() {
            const selectedMonth = document.getElementById('monthSelector').value;
            const filtered = transactions.filter(t => t.date.startsWith(selectedMonth));
            updateKPIs(filtered);
            renderTable(filtered);
            updateCharts(filtered);
        }

        function updateKPIs(data) {
            let inc = 0, exp = 0;
            data.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);
            document.getElementById('kpi-net-profit').textContent = formatRupiah(inc - exp);
            document.getElementById('kpi-total-income').textContent = formatRupiah(inc);
            document.getElementById('kpi-total-expense').textContent = formatRupiah(exp);
            document.getElementById('kpi-total-trx').textContent = data.length;
        }

        function renderTable(data) {
            const tbody = document.getElementById('transactionTableBody');
            tbody.innerHTML = data.sort((a,b) => new Date(b.date) - new Date(a.date)).map(t => `
                <tr class="border-b border-white/5 hover:bg-white/5 transition">
                    <td class="p-4">${t.date}</td>
                    <td class="p-4 text-white">${t.description}</td>
                    <td class="p-4 text-right ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">${t.type === 'income' ? '+' : '-'} Rp ${t.amount.toLocaleString('id-ID')}</td>
                    <td class="p-4 text-center"><button onclick="deleteTransaction(${t.id})" class="text-slate-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        function updateCharts(data) {
            if (dailyChartInstance) dailyChartInstance.destroy();
            if (revenueChartInstance) revenueChartInstance.destroy();

            const monthStr = document.getElementById('monthSelector').value;
            const daysInMonth = new Date(monthStr.split('-')[0], monthStr.split('-')[1], 0).getDate();
            const dailyIncome = new Array(daysInMonth).fill(0);
            const dailyExpense = new Array(daysInMonth).fill(0);

            let psTotal = 0, fnbTotal = 0;
            data.forEach(t => {
                const day = parseInt(t.date.split('-')[2]);
                if (t.type === 'income') {
                    dailyIncome[day - 1] += t.amount;
                    if (t.category.trim() === 'PlayStation') psTotal += t.amount;
                    if (t.category.trim() === 'FnB') fnbTotal += t.amount;
                } else {
                    dailyExpense[day - 1] += t.amount;
                }
            });

            dailyChartInstance = new Chart(document.getElementById('dailyChart'), {
                type: 'bar',
                data: { labels: Array.from({length: daysInMonth}, (_, i) => i + 1), datasets: [{ label: 'Income', data: dailyIncome, backgroundColor: '#10b981' }, { label: 'Expense', data: dailyExpense, backgroundColor: '#f43f5e' }] },
                options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } }
            });

            revenueChartInstance = new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: { labels: ['PlayStation', 'FnB'], datasets: [{ label: 'Rp', data: [psTotal, fnbTotal], backgroundColor: ['#38bdf8', '#fbbf24'] }] },
                options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } }
            });
        }

        function updateCategories() {
            const type = document.querySelector('input[name="type"]:checked').value;
            document.getElementById('category').innerHTML = type === 'income' ? '<option value="PlayStation">PlayStation</option><option value="FnB">FnB</option>' : '<option value="Utility">Utility</option><option value="Ops">Ops</option>';
        }

        document.getElementById('transactionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            transactions.push({ id: Date.now(), type: document.querySelector('input[name="type"]:checked').value, category: document.getElementById('category').value, amount: parseFloat(document.getElementById('amount').value), date: document.getElementById('date').value, description: document.getElementById('description').value });
            saveAndRefresh();
            e.target.reset();
        });

        const select = document.getElementById('monthSelector');
        ['2026-06', '2026-05', '2026-04'].forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = new Date(m+'-01').toLocaleDateString('id-ID', {month:'long', year:'numeric'});
            select.appendChild(opt);
        });

        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        updateCategories();
        updateBalanceDisplay();
        refreshDashboard();
    </script>
</body>
</html>
